{% extends "base.html" %}

{% block title %}Student Registration - Student Skill & Placement Tracker{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-7 col-lg-6">
            <div class="card card-custom p-4 p-md-5 shadow-lg border-0">
                <div class="text-center mb-4">
                    <div class="avatar-profile mx-auto d-flex align-items-center justify-content-center bg-primary-subtle text-primary mb-3" style="width: 70px; height: 70px;">
                        <i class="fa-solid fa-user-plus fs-2"></i>
                    </div>
                    <h3 class="fw-bold text-dark">Student Registration</h3>
                    <p class="text-muted small">Create your account to start tracking skills and applying for placement drives</p>
                </div>

                <form method="POST" action="{{ url_for('register') }}">
                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label for="name" class="form-label fw-semibold small">Full Name *</label>
                            <input type="text" class="form-control" id="name" name="name" value="{{ name or '' }}" placeholder="e.g. Alex Johnson" required>
                        </div>
                        <div class="col-md-6">
                            <label for="register_no" class="form-label fw-semibold small">Register / Roll Number</label>
                            <input type="text" class="form-control" id="register_no" name="register_no" value="{{ register_no or '' }}" placeholder="e.g. 717822P101">
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="email" class="form-label fw-semibold small">College Email Address *</label>
                        <input type="email" class="form-control" id="email" name="email" value="{{ email or '' }}" placeholder="student@college.edu" required>
                    </div>

                    <div class="mb-3">
                        <label for="department" class="form-label fw-semibold small">Department / Major</label>
                        <select class="form-select" id="department" name="department">
                            <option value="">Select Department...</option>
                            <option value="Computer Science and Engineering" {% if department == 'Computer Science and Engineering' %}selected{% endif %}>Computer Science and Engineering</option>
                            <option value="Information Technology" {% if department == 'Information Technology' %}selected{% endif %}>Information Technology</option>
                            <option value="Electronics and Communication" {% if department == 'Electronics and Communication' %}selected{% endif %}>Electronics and Communication</option>
                            <option value="Electrical and Electronics" {% if department == 'Electrical and Electronics' %}selected{% endif %}>Electrical and Electronics</option>
                            <option value="Mechanical Engineering" {% if department == 'Mechanical Engineering' %}selected{% endif %}>Mechanical Engineering</option>
                            <option value="Civil Engineering" {% if department == 'Civil Engineering' %}selected{% endif %}>Civil Engineering</option>
                            <option value="Artificial Intelligence & Data Science" {% if department == 'Artificial Intelligence & Data Science' %}selected{% endif %}>Artificial Intelligence & Data Science</option>
                        </select>
                    </div>

                    <div class="row g-3 mb-4">
                        <div class="col-md-6">
                            <label for="password" class="form-label fw-semibold small">Password (Min 6 chars) *</label>
                            <input type="password" class="form-control" id="password" name="password" placeholder="••••••••" required>
                        </div>
                        <div class="col-md-6">
                            <label for="confirm_password" class="form-label fw-semibold small">Confirm Password *</label>
                            <input type="password" class="form-control" id="confirm_password" name="confirm_password" placeholder="••••••••" required>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 py-2 mb-3">
                        <i class="fa-solid fa-user-check me-1"></i> Register Student Account
                    </button>
                </form>

                <div class="text-center">
                    <p class="text-muted small mb-0">
                        Already have an account? <a href="{{ url_for('login') }}" class="fw-semibold text-primary">Sign in here</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
