{% extends "base.html" %}

{% block title %}Sign In - Student Skill & Placement Tracker{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card card-custom p-4 p-md-5 shadow-lg border-0">
                <div class="text-center mb-4">
                    <div class="avatar-profile mx-auto d-flex align-items-center justify-content-center bg-primary-subtle text-primary mb-3" style="width: 70px; height: 70px;">
                        <i class="fa-solid fa-lock fs-2"></i>
                    </div>
                    <h3 class="fw-bold text-dark">Welcome Back</h3>
                    <p class="text-muted small">Sign in to access your placement dashboard</p>
                </div>

                <form method="POST" action="{{ url_for('login') }}">
                    <div class="mb-3">
                        <label for="email" class="form-label fw-semibold small">College Email Address</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0"><i class="fa-regular fa-envelope text-muted"></i></span>
                            <input type="email" class="form-control border-start-0" id="email" name="email" value="{{ email or '' }}" placeholder="name@college.edu" required autofocus>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label for="password" class="form-label fw-semibold small">Password</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0"><i class="fa-solid fa-key text-muted"></i></span>
                            <input type="password" class="form-control border-start-0" id="password" name="password" placeholder="••••••••" required>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 py-2 mb-3">
                        <i class="fa-solid fa-right-to-bracket me-1"></i> Sign In
                    </button>
                </form>

                <!-- Demo Viva Helper Buttons -->
                <div class="p-3 bg-light rounded-3 border mb-3">
                    <div class="d-flex align-items-center justify-content-between mb-2">
                        <span class="small fw-bold text-muted"><i class="fa-solid fa-bolt text-warning me-1"></i> Viva Demo Quick-Fill</span>
                        <span class="badge bg-secondary-subtle text-secondary">One-Click</span>
                    </div>
                    <div class="d-grid gap-2 d-md-flex">
                        <button type="button" class="btn btn-outline-primary btn-sm flex-fill" id="fill-student-login">
                            <i class="fa-solid fa-user-graduate me-1"></i> Student Demo
                        </button>
                        <button type="button" class="btn btn-outline-secondary btn-sm flex-fill" id="fill-admin-login">
                            <i class="fa-solid fa-shield-halved me-1"></i> Admin Demo
                        </button>
                    </div>
                </div>

                <div class="text-center">
                    <p class="text-muted small mb-0">
                        New student? <a href="{{ url_for('register') }}" class="fw-semibold text-primary">Create an account</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
